    - name: Enable and start tailscaled
      systemd:
        name: tailscaled
        enabled: true
        state: started
      when: tailscale | default(false)
      tags: [setup, tailscale]

    - name: Authenticate Tailscale
      command: >
        tailscale up
        {{ tailscale_args | default('') }}
        --authkey={{ tailscale_auth_key }}
      when: tailscale | default(false)
      changed_when: false
      tags: [setup, tailscale]

    # ─── DEPLOY SERVICES ──────────────────────────────────
    - name: Create deploy directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: "{{ pi_user }}"
        group: "{{ pi_user }}"
        mode: "0755"
      tags: [deploy]

    - name: Template docker-compose.yml to Pi
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        owner: "{{ pi_user }}"
        group: "{{ pi_user }}"
        mode: "0644"
      notify: Restart docker stack
      tags: [deploy]

    - name: Copy extra service files (Caddyfile, configs, etc.)
      synchronize:
        src: ../services/
        dest: "{{ deploy_dir }}/"
        rsync_opts:
          - "--exclude=docker-compose.yml"
      notify: Restart docker stack
      tags: [deploy]

    - name: Log in to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_username }}"
        password: "{{ ghcr_token }}"
      become_user: "{{ pi_user }}"
      no_log: true
      tags: [deploy]

    - name: Pull latest images
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        pull: always
        state: present
      become_user: "{{ pi_user }}"
      tags: [deploy]

    # ─── AUTO-DEPLOY (optional) ───────────────────────────
    - name: Template auto-deploy script
      template:
        src: templates/auto-deploy.sh.j2
        dest: "{{ deploy_dir }}/auto-deploy.sh"
        owner: "{{ pi_user }}"
        mode: "0755"
      when: auto_deploy | default(false)
      tags: [auto-deploy]

    - name: Install auto-deploy systemd service
      copy:
        dest: /etc/systemd/system/auto-deploy.service
        content: |
          [Unit]
          Description=Auto-deploy from git
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          User={{ pi_user }}
          WorkingDirectory={{ deploy_dir }}
          ExecStart={{ deploy_dir }}/auto-deploy.sh
        mode: "0644"
      when: auto_deploy | default(false)
      tags: [auto-deploy]

    - name: Install auto-deploy timer
      copy:
        dest: /etc/systemd/system/auto-deploy.timer
        content: |
          [Unit]
          Description=Run auto-deploy every {{ auto_deploy_interval }}

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec={{ auto_deploy_interval }}
          RandomizedDelaySec=30s

          [Install]
          WantedBy=timers.target
        mode: "0644"
      when: auto_deploy | default(false)
      notify: Enable auto-deploy timer
      tags: [auto-deploy]

  # ─── HANDLERS ─────────────────────────────────────────
  handlers:
    - name: Restart docker stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        state: restarted
      become_user: "{{ pi_user }}"

    - name: Enable wifi-connect
      systemd:
        name: wifi-connect.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable auto-deploy timer
      systemd:
        name: auto-deploy.timer
        enabled: true
        state: started
        daemon_reload: true
