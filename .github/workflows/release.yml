name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.crate }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # ── rp326-usb ──────────────────────────────────────────────────────
          - crate: rp326-usb
            target: aarch64-apple-darwin
            os: macos-latest
          - crate: rp326-usb
            target: x86_64-apple-darwin
            os: macos-latest
          - crate: rp326-usb
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - crate: rp326-usb
            target: x86_64-pc-windows-msvc
            os: windows-latest

          # ── thermal-printer-cli ────────────────────────────────────────────
          - crate: thermal-printer-cli
            target: aarch64-apple-darwin
            os: macos-latest
          - crate: thermal-printer-cli
            target: x86_64-apple-darwin
            os: macos-latest
          - crate: thermal-printer-cli
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - crate: thermal-printer-cli
            target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # reqwest's native-tls needs OpenSSL headers on Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && matrix.crate == 'thermal-printer-cli'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build
        run: cargo build -p ${{ matrix.crate }} --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.crate }}-${{ matrix.target }}.tar.gz ${{ matrix.crate }}
          echo "ASSET=target/${{ matrix.target }}/release/${{ matrix.crate }}-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.crate }}.exe -DestinationPath ${{ matrix.crate }}-${{ matrix.target }}.zip
          echo "ASSET=target/${{ matrix.target }}/release/${{ matrix.crate }}-${{ matrix.target }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

  publish-rp326-usb:
    name: Publish rp326-usb to crates.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish -p rp326-usb --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-thermal-printer-cli:
    name: Publish thermal-printer-cli to crates.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Publish
        run: cargo publish -p thermal-printer-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
